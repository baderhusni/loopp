[pytest]
# Put the backend/ dir (this file's location = rootdir) on sys.path so tests can
# `from app import ...` when run as a bare `pytest` (the tests are not an installed
# package). Without this, `pytest -q` fails to import `app` while `python -m pytest`
# works only because it happens to add the CWD. Pinning it here keeps CI and local
# runs identical.
pythonpath = .
testpaths = tests
