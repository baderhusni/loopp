name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test
        # Browser tests drive a real Chromium against the fixture app; no model
        # access is needed, because replay never calls one.
        env:
          MERIDIAN_OPERATOR_ID: svc_automation
          MERIDIAN_PASSCODE: Tr0ubadour!
        run: pytest
