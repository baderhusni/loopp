[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-cua"
version = "0.1.0"
description = "Record a computer-use run once; replay it deterministically forever."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "playwright>=1.40",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
scribe = "scribe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scribe.surface" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "-q --strict-markers"
markers = [
    "browser: needs a real browser and the fixture app (slower)",
]
filterwarnings = ["ignore::DeprecationWarning"]
